[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-input"
version = "1.1.0"
description = "A keyboard-driven, desktop-wide draft editor for Linux X11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "muntedcrocodile"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.4,<7", "python-xlib>=0.33,<1", "Pygments>=2.18,<3", "pyenchant>=3.2,<4"]

[project.scripts]
universal-input = "universal_input.app:main"

[project.urls]
Repository = "https://github.com/muntedcrocodile/universal_input"
Issues = "https://github.com/muntedcrocodile/universal_input/issues"

[tool.setuptools.packages.find]
include = ["universal_input*"]

[tool.setuptools.package-data]
universal_input = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
